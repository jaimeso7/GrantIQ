name: Node application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grantiq
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: grantiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grantiq -d grantiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm test
        env:
          GRANTIQ_TEST_POSTGRES_URL: postgresql://grantiq:test-only-password@localhost:5432/grantiq_test
      - run: npm audit --omit=optional --audit-level=high
