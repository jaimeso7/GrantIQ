name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests without downloading a model
        env:
          GRANTIQ_TEST_LOCAL_MODEL: '0'
        run: python -m pytest -q
