# Optional approved public pages. Grants.gov uses its official API independently.
# Administrators must review the actual website terms before enabling retrieval.
# Missing or disallowed robots.txt, redirects, login/challenges, or private network
# addresses prevent ingestion. Unconfirmed scraped fields always need review.
#
# Two parsers are available, and neither follows links:
#   parser: generic  - the page describes exactly ONE opportunity.
#   parser: listing  - the page advertises SEVERAL, one per repeated element. Each
#                      row's detail link is recorded for staff but never retrieved.
#
# Give every entry the URL the site actually serves. Redirects are never followed,
# so a URL that 301/302s anywhere will fail outright.
sources: []

# Examples only; both are disabled and terms-unreviewed. Copy into your local
# config and have an administrator review each site's terms before enabling.
