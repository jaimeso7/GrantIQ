name: Vision Is Priceless
organization_type: 501(c)(3)
mission: Help underserved children and adults in Northeast Florida access essential vision healthcare
  at no cost to the patient, including vision screenings, comprehensive eye exams, prescription glasses,
  specialty eye care, and sight-restoring services.
description: A 501(c)(3) nonprofit founded in 1996 serving Duval, Clay, Nassau, and St. Johns counties.
  Sight in Schools brings free vision screenings, comprehensive eye exams, and prescription glasses to
  children at Title I schools through Mobile Vision Clinics. Adult Vision Healthcare serves low-income,
  uninsured, and underinsured adults and older adults. Gift of Sight provides cataract-related and other
  sight-restoring specialty eye care.
